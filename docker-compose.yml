version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PORT=3001
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=${FLASK_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-default-dev-secret-key}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001,http://127.0.0.1:3001}
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@db:5432/syssim}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=syssim
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
